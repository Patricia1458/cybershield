{% load cybershield_extras %}
<header class="topbar">
    <div class="d-flex align-items-center gap-3">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
        </button>
        {% block page_title %}{% endblock %}
    </div>
    <div class="d-flex align-items-center gap-3">
        <span class="topbar-greeting">{% time_greeting %}, {{ user.first_name|default:user.username }}</span>
        <div class="avatar avatar-sm">{% if user.first_name %}{{ user.first_name|first|upper }}{{ user.last_name|first|upper }}{% else %}{{ user.username|slice:":2"|upper }}{% endif %}</div>
    </div>
</header>
