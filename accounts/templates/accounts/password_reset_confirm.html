{% extends 'base_auth.html' %}
{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-form-panel" style="max-width:500px;margin:0 auto;">
            <h2>Set New Password</h2>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
                </div>
                {% endfor %}
                <button type="submit" class="btn-cs btn-cs-primary w-100">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
