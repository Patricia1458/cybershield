{% extends 'base_auth.html' %}
{% block title %}Account Locked — CyberShield{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-brand">
            <h1>CyberShield</h1>
            <div class="tagline">Think Before You Click.</div>
        </div>
        <div class="auth-form-panel">
            <h2>Too Many Failed Attempts</h2>
            <p class="auth-sub">Too many failed login attempts. Please try again later.</p>
            <p class="text-center mt-3 text-small"><a href="{% url 'login' %}">Back to Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
