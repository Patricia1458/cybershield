{% extends 'base_auth.html' %}
{% block title %}Reset Password — CyberShield{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-brand">
            <h1>CyberShield</h1>
            <div class="tagline">Think Before You Click.</div>
        </div>
        <div class="auth-form-panel">
            <h2>Forgot Password</h2>
            <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required placeholder="admin@company.com">
                </div>
                <button type="submit" class="btn-cs btn-cs-primary w-100">Send Reset Link</button>
            </form>
            <p class="text-center mt-3 text-small"><a href="{% url 'login' %}">Back to Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
